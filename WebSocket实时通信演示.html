<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket实时通信演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .panel {
            flex: 1;
            min-width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .panel h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-connected {
            background-color: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }
        
        .status-disconnected {
            background-color: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }
        
        .status-connecting {
            background-color: #f39c12;
            box-shadow: 0 0 10px #f39c12;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .connection-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-connect {
            background-color: #2ecc71;
            color: white;
        }
        
        .btn-disconnect {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-send {
            background-color: #3498db;
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message-input-area {
            margin-bottom: 25px;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .messages-container {
            height: 350px;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        
        .message {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            word-break: break-word;
        }
        
        .message-sent {
            background-color: #d4edda;
            border-left: 5px solid #28a745;
        }
        
        .message-received {
            background-color: #d1ecf1;
            border-left: 5px solid #17a2b8;
        }
        
        .message-system {
            background-color: #f8f9fa;
            border-left: 5px solid #6c757d;
            font-style: italic;
            text-align: center;
        }
        
        .message-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }
        
        .server-info {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .panel {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WebSocket实时通信演示</h1>
            <p class="subtitle">实现浏览器与服务器的全双工实时通信</p>
        </header>
        
        <div class="main-content">
            <div class="panel">
                <h2>连接控制</h2>
                
                <div class="connection-status">
                    <div id="statusIndicator" class="status-indicator status-disconnected"></div>
                    <span id="statusText">已断开连接</span>
                </div>
                
                <div class="connection-controls">
                    <input type="text" id="serverUrl" placeholder="WebSocket服务器地址" value="ws://localhost:8080">
                    <button id="connectBtn" class="btn-connect">连接</button>
                    <button id="disconnectBtn" class="btn-disconnect" disabled>断开</button>
                </div>
                
                <div class="server-info">
                    <p>提示：此演示使用公共的WebSocket回显服务器。您也可以连接到自己的WebSocket服务器。</p>
                    <p>连接状态: <span id="connectionDetails">未连接</span></p>
                </div>
            </div>
            
            <div class="panel">
                <h2>消息收发</h2>
                
                <div class="message-input-area">
                    <textarea id="messageInput" placeholder="请输入要发送的消息..."></textarea>
                    <button id="sendBtn" class="btn-send" disabled>发送消息</button>
                </div>
                
                <div class="server-info">
                    <p>发送消息后，服务器会将消息原样返回（回显模式）。</p>
                    <p>已发送: <span id="sentCount">0</span> 条 | 已接收: <span id="receivedCount">0</span> 条</p>
                </div>
            </div>
            
            <div class="panel">
                <h2>消息记录</h2>
                
                <div class="messages-container" id="messagesContainer">
                    <div class="message message-system">
                        WebSocket消息记录将显示在这里
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>WebSocket演示 &copy; 2023 | 使用HTML5 WebSocket API实现实时双向通信</p>
        </footer>
    </div>

    <script>
        // WebSocket相关变量
        let socket = null;
        let isConnected = false;
        let sentCount = 0;
        let receivedCount = 0;
        
        // DOM元素
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const connectionDetails = document.getElementById('connectionDetails');
        const sentCountElement = document.getElementById('sentCount');
        const receivedCountElement = document.getElementById('receivedCount');
        
        // 更新连接状态显示
        function updateConnectionStatus(status) {
            statusIndicator.className = 'status-indicator';
            
            switch(status) {
                case 'connected':
                    statusIndicator.classList.add('status-connected');
                    statusText.textContent = '已连接';
                    connectionDetails.textContent = `已连接到 ${socket.url}`;
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    sendBtn.disabled = false;
                    isConnected = true;
                    break;
                    
                case 'disconnected':
                    statusIndicator.classList.add('status-disconnected');
                    statusText.textContent = '已断开连接';
                    connectionDetails.textContent = '未连接';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    sendBtn.disabled = true;
                    isConnected = false;
                    break;
                    
                case 'connecting':
                    statusIndicator.classList.add('status-connecting');
                    statusText.textContent = '连接中...';
                    connectionDetails.textContent = '正在建立连接';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = true;
                    sendBtn.disabled = true;
                    break;
                    
                case 'error':
                    statusIndicator.classList.add('status-disconnected');
                    statusText.textContent = '连接错误';
                    connectionDetails.textContent = '连接发生错误';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    sendBtn.disabled = true;
                    isConnected = false;
                    break;
            }
        }
        
        // 添加消息到消息记录
        function addMessage(content, type, isSent = true) {
            const messageElement = document.createElement('div');
            messageElement.className = `message message-${type}`;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            
            let directionText = isSent ? '发送' : '接收';
            
            messageElement.innerHTML = `
                <div>${content}</div>
                <div class="message-info">
                    <span>${directionText}</span>
                    <span>${timeString}</span>
                </div>
            `;
            
            messagesContainer.appendChild(messageElement);
            
            // 自动滚动到底部
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 连接到WebSocket服务器
        function connectWebSocket() {
            const serverUrl = serverUrlInput.value.trim();
            
            if (!serverUrl) {
                alert('请输入WebSocket服务器地址');
                return;
            }
            
            updateConnectionStatus('connecting');
            
            try {
                socket = new WebSocket(serverUrl);
                
                socket.onopen = function(event) {
                    console.log('WebSocket连接已建立', event);
                    updateConnectionStatus('connected');
                    addMessage(`已连接到WebSocket服务器: ${serverUrl}`, 'system', false);
                };
                
                socket.onmessage = function(event) {
                    console.log('收到消息:', event.data);
                    receivedCount++;
                    receivedCountElement.textContent = receivedCount;
                    addMessage(event.data, 'received', false);
                };
                
                socket.onclose = function(event) {
                    console.log('WebSocket连接已关闭', event);
                    updateConnectionStatus('disconnected');
                    
                    let closeMessage = 'WebSocket连接已关闭';
                    if (event.code !== 1000) {
                        closeMessage += `，代码: ${event.code}`;
                    }
                    if (event.reason) {
                        closeMessage += `，原因: ${event.reason}`;
                    }
                    
                    addMessage(closeMessage, 'system', false);
                    socket = null;
                };
                
                socket.onerror = function(error) {
                    console.error('WebSocket错误:', error);
                    updateConnectionStatus('error');
                    addMessage('WebSocket连接错误，请检查服务器地址或网络连接', 'system', false);
                };
                
            } catch (error) {
                console.error('创建WebSocket连接时出错:', error);
                updateConnectionStatus('error');
                addMessage(`连接失败: ${error.message}`, 'system', false);
            }
        }
        
        // 断开WebSocket连接
        function disconnectWebSocket() {
            if (socket && isConnected) {
                socket.close(1000, '用户主动断开连接');
            }
        }
        
        // 发送消息
        function sendMessage() {
            if (!isConnected || !socket) {
                alert('未连接到WebSocket服务器');
                return;
            }
            
            const message = messageInput.value.trim();
            
            if (!message) {
                alert('请输入要发送的消息');
                return;
            }
            
            try {
                socket.send(message);
                sentCount++;
                sentCountElement.textContent = sentCount;
                addMessage(message, 'sent', true);
                messageInput.value = '';
            } catch (error) {
                console.error('发送消息时出错:', error);
                addMessage(`发送失败: ${error.message}`, 'system', false);
            }
        }
        
        // 初始化事件监听
        function initEventListeners() {
            // 连接按钮
            connectBtn.addEventListener('click', connectWebSocket);
            
            // 断开连接按钮
            disconnectBtn.addEventListener('click', disconnectWebSocket);
            
            // 发送按钮
            sendBtn.addEventListener('click', sendMessage);
            
            // 在输入框中按Enter发送消息
            messageInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            
            // 在服务器地址输入框中按Enter连接
            serverUrlInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    connectWebSocket();
                }
            });
            
            // 添加一些示例消息
            setTimeout(() => {
                addMessage('这是一个WebSocket演示应用。点击"连接"按钮连接到WebSocket服务器，然后在下方输入消息并发送。', 'system', false);
                addMessage('此演示使用回显服务器，您发送的消息将被原样返回。', 'system', false);
            }, 500);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initEventListeners();
            updateConnectionStatus('disconnected');
            
            // 添加一些预定义的服务器地址选项
            const serverOptions = [
                { name: '测试服务器', url: 'ws://localhost:8080' },
                { name: '公共回显服务器01', url: 'wss://echo.websocket.org' },
                { name: '公共回显服务器02', url: 'wss://ws.postman-echo.com/raw' }
            ];
            
            // 创建服务器选择下拉菜单
            const serverSelect = document.createElement('select');
            serverSelect.id = 'serverSelect';
            serverSelect.innerHTML = '<option value="">选择预设服务器</option>' +
                serverOptions.map(option => `<option value="${option.url}">${option.name}</option>`).join('');
            
            serverSelect.addEventListener('change', function() {
                if (this.value) {
                    serverUrlInput.value = this.value;
                }
            });
            
            serverUrlInput.parentNode.insertBefore(serverSelect, serverUrlInput.nextSibling);
        });
    </script>
</body>
</html>
