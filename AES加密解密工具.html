<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES-CBC 加密/解密工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #1a1a2e;
            color: #e6e6e6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: #162447;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin-top: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            padding: 25px 30px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        
        .config-section {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 15px 30px;
            background-color: #1f4068;
            border-bottom: 1px solid #0f3460;
        }
        
        .config-item {
            margin: 10px 0;
            flex: 1;
            min-width: 300px;
        }
        
        .config-label {
            display: block;
            margin-bottom: 8px;
            color: #00b4db;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .config-value {
            background-color: #1a1a2e;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            word-break: break-all;
            font-family: monospace;
            font-size: 1rem;
        }
        
        .main-content {
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00b4db;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .input-label i {
            font-size: 1.2rem;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background-color: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 1rem;
            resize: vertical;
            font-family: monospace;
        }
        
        textarea:focus {
            outline: none;
            border-color: #00b4db;
            box-shadow: 0 0 0 2px rgba(0, 180, 219, 0.2);
        }
        
        .button-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        
        .encrypt-btn {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
        }
        
        .encrypt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(0, 180, 219, 0.3);
        }
        
        .decrypt-btn {
            background: linear-gradient(135deg, #f46b45, #eea849);
            color: white;
        }
        
        .decrypt-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(244, 107, 69, 0.3);
        }
        
        .clear-btn {
            background: linear-gradient(135deg, #8e9eab, #eef2f3);
            color: #162447;
        }
        
        .clear-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(142, 158, 171, 0.3);
        }
        
        .result-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        
        .result-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00b4db;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .result-box {
            background-color: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            min-height: 100px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .copy-btn {
            align-self: flex-end;
            padding: 10px 20px;
            background-color: #1f4068;
            color: #e6e6e6;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }
        
        .copy-btn:hover {
            background-color: #0f3460;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #a0a0c0;
            font-size: 0.9rem;
            border-top: 1px solid #0f3460;
            margin-top: 20px;
            width: 100%;
        }
        
        .warning {
            background-color: rgba(244, 107, 69, 0.1);
            border-left: 4px solid #f46b45;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 10px;
        }
        
        .warning-title {
            color: #f46b45;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .config-section {
                flex-direction: column;
            }
            
            .config-item {
                min-width: 100%;
            }
            
            .button-section {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-lock"></i> AES-CBC 加密/解密工具</h1>
        </header>
        
        <div class="config-section">
            <div class="config-item">
                <span class="config-label">初始化向量 (IV):</span>
                <div class="config-value">a1b2c3d4e5f6g7h8</div>
            </div>
            <div class="config-item">
                <span class="config-label">密钥 (Key):</span>
                <div class="config-value">63dTjxISXlwAso0n</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <label class="input-label">
                    <i class="fas fa-keyboard"></i> 输入文本
                </label>
                <textarea id="inputText" placeholder="在此输入要加密或解密的文本..."></textarea>
            </div>
            
            <div class="button-section">
                <button class="encrypt-btn" id="encryptBtn">
                    <i class="fas fa-lock"></i> 加密文本
                </button>
                <button class="decrypt-btn" id="decryptBtn">
                    <i class="fas fa-unlock"></i> 解密文本
                </button>
                <button class="clear-btn" id="clearBtn">
                    <i class="fas fa-broom"></i> 清空内容
                </button>
            </div>
            
            <div class="result-section">
                <label class="result-label">
                    <i class="fas fa-poll"></i> 结果
                </label>
                <div class="result-box" id="resultBox"></div>
                <button class="copy-btn" id="copyBtn">
                    <i class="far fa-copy"></i> 复制结果
                </button>
            </div>
            
            <div class="warning">
                <div class="warning-title">
                    <i class="fas fa-exclamation-triangle"></i> 安全提示
                </div>
                <p>本工具使用固定密钥和初始化向量(IV)，适用于演示和学习目的。在实际生产环境中，应使用随机生成的密钥和IV，并妥善保管密钥。</p>
                <p style="margin-top: 8px;">注：本工具运行在浏览器端，所有加解密操作均在本地完成，数据不会发送到服务器。</p>
            </div>
        </div>
    </div>
    
    <footer>
        <p>AES-CBC 加密/解密工具 &copy; 2023 | 使用CryptoJS库实现 | 向量: a1b2c3d4e5f6g7h8 | 密钥: 63dTjxISXlwAso0n</p>
    </footer>

    <!-- 引入 CryptoJS 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <script>
        // 定义固定的密钥和向量
        const IV = "a1b2c3d4e5f6g7h8";
        const KEY = "63dTjxISXlwAso0n";
        
        // DOM 元素
        const inputText = document.getElementById('inputText');
        const resultBox = document.getElementById('resultBox');
        const encryptBtn = document.getElementById('encryptBtn');
        const decryptBtn = document.getElementById('decryptBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        // 初始化结果框
        resultBox.textContent = "加密或解密后的结果将显示在这里...";
        
        // 加密函数
        function encryptText(text) {
            try {
                // 使用 CryptoJS 进行 AES-CBC 加密
                const encrypted = CryptoJS.AES.encrypt(
                    text, 
                    CryptoJS.enc.Utf8.parse(KEY),
                    {
                        iv: CryptoJS.enc.Utf8.parse(IV),
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    }
                );
                
                // 返回Base64编码的密文
                return encrypted.toString();
            } catch (error) {
                console.error("加密错误:", error);
                return `加密失败: ${error.message}`;
            }
        }
        
        // 解密函数
        function decryptText(ciphertext) {
            try {
                // 使用 CryptoJS 进行 AES-CBC 解密
                const decrypted = CryptoJS.AES.decrypt(
                    ciphertext,
                    CryptoJS.enc.Utf8.parse(KEY),
                    {
                        iv: CryptoJS.enc.Utf8.parse(IV),
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    }
                );
                
                // 将解密结果转换为UTF-8字符串
                return decrypted.toString(CryptoJS.enc.Utf8);
            } catch (error) {
                console.error("解密错误:", error);
                return `解密失败: 请检查输入是否为有效的AES-CBC密文\n错误详情: ${error.message}`;
            }
        }
        
        // 加密按钮点击事件
        encryptBtn.addEventListener('click', function() {
            const text = inputText.value.trim();
            
            if (!text) {
                resultBox.textContent = "请输入要加密的文本！";
                return;
            }
            
            resultBox.textContent = "加密中...";
            
            // 短暂延迟以便用户看到"加密中"提示
            setTimeout(() => {
                const encrypted = encryptText(text);
                resultBox.textContent = `密文(Base64):\n${encrypted}\n\n密文(Hex):\n${CryptoJS.enc.Base64.parse(encrypted).toString(CryptoJS.enc.Hex)}`;
            }, 100);
        });
        
        // 解密按钮点击事件
        decryptBtn.addEventListener('click', function() {
            const text = inputText.value.trim();
            
            if (!text) {
                resultBox.textContent = "请输入要解密的密文！";
                return;
            }
            
            resultBox.textContent = "解密中...";
            
            // 短暂延迟以便用户看到"解密中"提示
            setTimeout(() => {
                const decrypted = decryptText(text);
                
                if (decrypted) {
                    resultBox.textContent = `解密成功！\n\n明文:\n${decrypted}`;
                } else {
                    resultBox.textContent = "解密失败：可能输入了无效的密文或格式不正确。";
                }
            }, 100);
        });
        
        // 清空按钮点击事件
        clearBtn.addEventListener('click', function() {
            inputText.value = "";
            resultBox.textContent = "加密或解密后的结果将显示在这里...";
            inputText.focus();
        });
        
        // 复制按钮点击事件
        copyBtn.addEventListener('click', function() {
            const resultText = resultBox.textContent;
            
            if (!resultText || resultText.includes("将显示在这里")) {
                alert("没有可复制的内容！");
                return;
            }
            
            // 使用现代剪贴板API
            navigator.clipboard.writeText(resultText).then(
                function() {
                    // 临时改变按钮文本和图标
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                    copyBtn.style.backgroundColor = "#2a9d8f";
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.style.backgroundColor = "";
                    }, 2000);
                },
                function(err) {
                    console.error("复制失败: ", err);
                    alert("复制失败，请手动选择并复制文本。");
                }
            );
        });
        
        // 示例：自动加密默认文本
        window.addEventListener('load', function() {
            // 页面加载后自动加密示例文本
            setTimeout(() => {
                encryptBtn.click();
            }, 500);
        });
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // Ctrl+E 加密
            if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                encryptBtn.click();
            }
            
            // Ctrl+D 解密
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                decryptBtn.click();
            }
            
            // Ctrl+L 清空
            if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                clearBtn.click();
            }
        });
    </script>
</body>
</html>
